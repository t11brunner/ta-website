<link rel="stylesheet" href="../styles.css">
<div style="padding:20px;background:var(--paper);display:flex;gap:20px;align-items:center;font-family:var(--f-mono);font-size:9px;color:var(--mute)">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:50px;background:var(--card);border:1px solid var(--line);border-radius:14px"></div>14px card</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:26px;background:var(--accent-soft);border-radius:999px"></div>pill</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:var(--accent-soft);border-radius:50%"></div>circle badge</div>
</div>
