<!-- @dsCard group="Colors" viewport="700x140" name="Paper & Ink" subtitle="Base neutrals — warm paper ground, near-black ink" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:140px;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em">
<div style="flex:1;background:var(--paper);color:var(--ink);display:flex;align-items:flex-end;padding:10px">paper</div>
<div style="flex:1;background:var(--paper-2);color:var(--ink);display:flex;align-items:flex-end;padding:10px">paper-2</div>
<div style="flex:1;background:var(--card);color:var(--ink);display:flex;align-items:flex-end;padding:10px;border-left:1px solid var(--line)">card</div>
<div style="flex:1;background:var(--ink);color:var(--paper);display:flex;align-items:flex-end;padding:10px">ink</div>
<div style="flex:1;background:var(--ink-soft);color:var(--paper);display:flex;align-items:flex-end;padding:10px">ink-soft</div>
<div style="flex:1;background:var(--mute);color:var(--paper);display:flex;align-items:flex-end;padding:10px">mute</div>
</div>
